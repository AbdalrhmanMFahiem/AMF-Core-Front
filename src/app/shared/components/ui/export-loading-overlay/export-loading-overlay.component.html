<div
  *ngIf="exportLoadingService.isLoading$ | async"
  class="fixed inset-0 z-99999 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md transition-all duration-300 animate-in fade-in"
>
  <div
    class="relative w-full max-w-md p-8 overflow-hidden bg-white/95 dark:bg-slate-900/95 border border-emerald-500/30 dark:border-emerald-500/20 shadow-2xl rounded-3xl text-center space-y-6 transform transition-all scale-100"
  >
    <!-- Background Glow Effect -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-teal-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Animated Excel Icon Container -->
    <div class="relative mx-auto w-24 h-24 flex items-center justify-center">
      <!-- Outer Rotating Glow Ring -->
      <div class="absolute inset-0 rounded-2xl bg-linear-to-tr from-emerald-500 via-teal-500 to-green-600 animate-spin opacity-40 blur-sm"></div>

      <!-- Icon Box -->
      <div class="relative w-20 h-20 bg-linear-to-br from-emerald-600 to-teal-700 rounded-2xl shadow-xl flex items-center justify-center border border-emerald-400/30">
        <!-- Excel Grid Icon -->
        <svg class="w-11 h-11 text-white animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>

        <!-- Format Badge -->
        <span class="absolute -bottom-2 -right-2 px-2 py-0.5 text-[10px] font-black tracking-wider text-white bg-slate-900 border border-emerald-400/50 rounded-md shadow-md">
          .XLSX
        </span>
      </div>
    </div>

    <!-- Title & Subtitle Text -->
    <div class="space-y-2 relative z-10">
      <h3 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">
        {{ defaultTitle | translate }}
      </h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed px-2">
        {{ defaultSubtitle | translate }}
      </p>
    </div>

    <!-- Animated Progress Bar -->
    <div class="space-y-2 relative z-10">
      <div class="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-200 dark:border-slate-700">
        <div class="bg-linear-to-r from-emerald-500 via-teal-400 to-green-500 h-full rounded-full animate-pulse transition-all duration-500 w-full"></div>
      </div>

      <div class="flex items-center justify-between text-[11px] font-medium text-slate-400 dark:text-slate-500">
        <span class="inline-flex items-center gap-1">
          <svg class="animate-spin h-3 w-3 text-emerald-500" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ 'reports.exportLoading.exporting' | translate }}
        </span>
        <span class="font-mono text-emerald-600 dark:text-emerald-400 font-semibold">AMFCore Reports</span>
      </div>
    </div>
  </div>
</div>
