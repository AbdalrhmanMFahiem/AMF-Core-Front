<div class="p-5 border border-gray-200 rounded-2xl bg-white dark:border-gray-800 dark:bg-white/[0.03] lg:p-6 shadow-sm">
  <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex flex-col items-center w-full gap-5 sm:flex-row">
      <!-- Profile Photo Container with Upload Overlay -->
      <div class="relative group w-24 h-24 rounded-full overflow-hidden border-2 border-brand-500/20 p-0.5 shadow-md bg-gray-50 dark:bg-gray-800">
        <img [src]="photoUrl" [alt]="fullName" class="w-full h-full rounded-full object-cover" />
        
        <!-- Uploading Spinner -->
        <div *ngIf="isUploading" class="absolute inset-0 bg-black/50 flex items-center justify-center text-white">
          <svg class="animate-spin h-6 w-6 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>

        <!-- Camera Hover Button -->
        <label *ngIf="!isUploading" class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center text-white cursor-pointer transition-opacity duration-200">
          <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <span class="text-[10px] font-bold">تغيير الصورة</span>
          <input type="file" (change)="onFileSelected($event)" accept="image/*" class="sr-only" />
        </label>
      </div>

      <!-- User Details -->
      <div class="text-center sm:text-right">
        <div class="flex items-center justify-center sm:justify-start gap-2 mb-1">
          <h4 class="text-xl font-extrabold text-gray-900 dark:text-white">
            {{ fullName }}
          </h4>
          <span *ngIf="profile?.code" class="px-2.5 py-0.5 rounded-full bg-brand-500/10 text-brand-600 dark:bg-brand-500/20 dark:text-brand-400 font-mono text-xs font-bold">
            #{{ profile?.code }}
          </span>
        </div>

        <div class="flex flex-wrap items-center justify-center sm:justify-start gap-3 text-xs text-gray-500 dark:text-gray-400">
          <span class="flex items-center gap-1.5">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
            {{ profile?.email }}
          </span>
          <span *ngIf="profile?.firstEName" class="hidden sm:inline text-gray-300 dark:text-gray-700">•</span>
          <span *ngIf="profile?.firstEName" class="font-medium">
            EN: {{ profile?.firstEName }} {{ profile?.lastEName }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="uploadError" class="mt-3 p-2 bg-rose-50 text-rose-600 text-xs rounded-lg text-center font-bold">
    {{ uploadError }}
  </div>
</div>
