<div *ngIf="partnerId" class="inline-flex items-center gap-1.5">
  <button type="button" (click)="openQuickView($event)"
    title="عرض تفاصيل الشريك الكاملة والملخص المالي"
    class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold transition-all transform hover:scale-105 shadow-xs border cursor-pointer"
    [ngClass]="balance !== null && balance >= 0 ? 'bg-success-50 text-success-700 border-success-200 hover:bg-success-100 dark:bg-success-500/20 dark:text-success-300 dark:border-success-500/30' : 'bg-error-50 text-error-700 border-error-200 hover:bg-error-100 dark:bg-error-500/20 dark:text-error-300 dark:border-error-500/30'">
    
    <span *ngIf="loading" class="animate-spin rounded-full h-3 w-3 border-b-2 border-current"></span>
    
    <svg *ngIf="!loading" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>

    <span *ngIf="showLabel" class="text-[11px] font-normal opacity-80">
      {{ 'partnerQuickView.currentBalance' | translate }}:
    </span>

    <span *ngIf="balance !== null" class="font-extrabold dir-ltr">
      {{ balance | number:'1.2-2' }}
    </span>
  </button>

  <app-partner-quick-view-modal [isOpen]="isModalOpen" [partnerId]="partnerId" (close)="closeQuickView()">
  </app-partner-quick-view-modal>
</div>
