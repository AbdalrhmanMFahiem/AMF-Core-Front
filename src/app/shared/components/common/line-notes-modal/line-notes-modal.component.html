<app-modal [isOpen]="isOpen" (close)="onClose()" [title]="title || ('common.statement' | translate)" className="max-w-lg mx-auto">
  <div class="p-6 space-y-5 bg-white dark:bg-gray-900">
    
    <!-- Item Context Header Badge -->
    <div *ngIf="itemCode || itemName" class="flex flex-wrap items-center gap-2 px-4 py-3 rounded-xl bg-brand-50/60 dark:bg-brand-500/10 border border-brand-100 dark:border-brand-500/20">
      <div *ngIf="itemCode" class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-white dark:bg-gray-800 text-xs font-mono font-bold text-brand-600 dark:text-brand-400 border border-brand-200 dark:border-brand-500/30 shadow-xs">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
        </svg>
        <span>{{ itemCode }}</span>
      </div>
      <span *ngIf="itemName" class="text-sm font-bold text-gray-900 dark:text-white truncate max-w-xs">{{ itemName }}</span>
    </div>

    <!-- Main Textarea Section -->
    <div class="space-y-2">
      <div class="flex items-center justify-between">
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300">
          {{ 'common.statement' | translate }}
        </label>
        <!-- Character Count -->
        <span class="text-xs font-mono" [ngClass]="{
            'text-gray-400 dark:text-gray-400': localNotes.length < maxLength,
            'text-error-500 font-bold dark:text-error-400': localNotes.length >= maxLength
          }">
          {{ localNotes.length }} / {{ maxLength }}
        </span>
      </div>

      <div class="relative">
        <textarea
          [(ngModel)]="localNotes"
          [readonly]="readonly"
          [attr.maxlength]="maxLength"
          rows="4"
          [placeholder]="'common.enterNotesPlaceholder' | translate"
          class="w-full rounded-2xl border border-gray-200 bg-gray-50/60 dark:bg-gray-800/80 dark:border-gray-700 p-4 text-sm text-gray-800 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-400 focus:border-brand-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand-500/10 dark:focus:border-brand-500 dark:focus:bg-gray-800 shadow-xs transition-all resize-none disabled:opacity-75 disabled:cursor-not-allowed">
        </textarea>

        <!-- Clear Button inside Textarea area -->
        <button *ngIf="!readonly && localNotes" type="button" (click)="clearNotes()"
          class="absolute left-3 bottom-3 text-xs text-gray-400 hover:text-error-500 transition-colors flex items-center gap-1 bg-white/90 dark:bg-gray-800/90 px-2.5 py-1 rounded-lg border border-gray-200 dark:border-gray-700 shadow-xs dark:text-gray-300 dark:hover:text-error-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          <span>{{ 'common.clear' | translate }}</span>
        </button>
      </div>
    </div>

    <!-- Quick Presets Chips -->
    <div *ngIf="!readonly" class="space-y-2 pt-1">
      <span class="block text-xs font-medium text-gray-500 dark:text-gray-400">
        {{ 'common.quickSuggestions' | translate }}:
      </span>
      <div class="flex flex-wrap gap-2">
        <button *ngFor="let chip of quickPresets" type="button" (click)="appendPreset(chip.text)"
          class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:border-brand-300 hover:bg-brand-50 hover:text-brand-600 dark:hover:border-brand-500/40 dark:hover:bg-brand-500/20 dark:hover:text-brand-400 transition-all duration-150 active:scale-95">
          <span>+ {{ chip.label }}</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Footer Actions -->
  <div class="px-6 py-4 bg-gray-50/80 dark:bg-gray-800/50 border-t border-gray-100 dark:border-gray-800 flex justify-end items-center gap-3 rounded-b-3xl">
    <button type="button" (click)="onClose()"
      class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-200 rounded-xl hover:bg-gray-50 dark:bg-gray-800 dark:text-gray-300 dark:border-gray-700 dark:hover:bg-gray-700 transition-colors shadow-theme-xs">
      {{ (readonly ? 'common.back' : 'common.cancel') | translate }}
    </button>
    <button *ngIf="!readonly" type="button" (click)="onSave()"
      class="inline-flex items-center gap-2 px-5 py-2.5 text-sm font-medium text-white bg-brand-500 rounded-xl hover:bg-brand-600 transition-all shadow-theme-sm hover:shadow-theme-md active:scale-98">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
      <span>{{ 'common.save' | translate }}</span>
    </button>
  </div>
</app-modal>
