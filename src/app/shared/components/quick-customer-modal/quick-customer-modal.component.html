<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto overflow-x-hidden bg-gray-900/50 p-4 backdrop-blur-sm">
  <div class="relative w-full max-w-xl rounded-2xl bg-white p-6 shadow-2xl dark:bg-gray-800 border border-gray-100 dark:border-gray-700">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between pb-4 border-b border-gray-100 dark:border-gray-700">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand-50 text-brand-600 dark:bg-brand-500/10 dark:text-brand-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
          </svg>
        </div>
        <div>
          <h3 class="text-lg font-bold text-gray-900 dark:text-white">
            {{ 'businessPartners.quickAddCustomer' | translate }}
          </h3>
          <p class="text-xs text-gray-500 dark:text-gray-400">
            {{ 'businessPartners.quickAddSubtitle' | translate }}
          </p>
        </div>
      </div>
      
      <button type="button" (click)="closeModal()"
        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="mt-4 p-3 rounded-lg bg-error-50 border border-error-200 text-error-700 text-sm flex items-center gap-2 dark:bg-error-500/10 dark:border-error-500/20 dark:text-error-400">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Form Content -->
    <form (ngSubmit)="onSubmit()" class="mt-5 space-y-4">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        
        <!-- Code -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
            {{ 'common.code' | translate }} <span class="text-error-500">*</span>
          </label>
          <input type="text" [(ngModel)]="model.code" name="code" required
            class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3.5 py-2 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-900 dark:text-white focus:border-brand-500 focus:outline-none" />
        </div>

        <!-- Arabic Name -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
            {{ 'common.arabicName' | translate }} <span class="text-error-500">*</span>
          </label>
          <input type="text" [(ngModel)]="model.aName" name="aName" required placeholder="مثال: شركة الأمل للمقاولات"
            class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-900 dark:text-white focus:border-brand-500 focus:outline-none" />
        </div>

        <!-- English Name -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
            {{ 'common.englishName' | translate }}
          </label>
          <input type="text" [(ngModel)]="model.eName" name="eName" placeholder="e.g. Al-Amal Co."
            class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-900 dark:text-white focus:border-brand-500 focus:outline-none" />
        </div>

        <!-- Phone Number -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
            {{ 'common.phone' | translate }}
          </label>
          <input type="text" [(ngModel)]="model.phoneNumber" name="phoneNumber" placeholder="0500000000"
            class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-900 dark:text-white focus:border-brand-500 focus:outline-none" />
        </div>

        <!-- Email -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
            {{ 'common.email' | translate }}
          </label>
          <input type="email" [(ngModel)]="model.email" name="email" placeholder="customer@domain.com"
            class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-900 dark:text-white focus:border-brand-500 focus:outline-none" />
        </div>

        <!-- Address -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
            {{ 'common.address' | translate }}
          </label>
          <input type="text" [(ngModel)]="model.address" name="address" placeholder="الرياض - حي الملز"
            class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-900 dark:text-white focus:border-brand-500 focus:outline-none" />
        </div>
      </div>

      <!-- Notes -->
      <div>
        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
          {{ 'common.notes' | translate }}
        </label>
        <textarea [(ngModel)]="model.notes" name="notes" rows="2"
          class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-900 dark:text-white focus:border-brand-500 focus:outline-none"></textarea>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-700">
        <button type="button" (click)="closeModal()"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600 transition-colors">
          {{ 'common.cancel' | translate }}
        </button>
        <button type="submit" [disabled]="saving"
          class="flex items-center gap-2 px-5 py-2 text-sm font-medium text-white bg-brand-500 rounded-lg shadow-theme-xs hover:bg-brand-600 disabled:opacity-50 transition-colors">
          <svg *ngIf="saving" class="h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>{{ (saving ? 'common.saving' : 'common.save') | translate }}</span>
        </button>
      </div>
    </form>

  </div>
</div>
