<app-modal [isOpen]="isOpen" (close)="onClose()" [className]="'max-w-lg'">
  <!-- Header with icon + title -->
  <div class="px-6 py-5 border-b border-gray-100 dark:border-white/5 flex justify-between items-center bg-white dark:bg-gray-900 rounded-t-2xl">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl bg-brand-50 dark:bg-brand-500/10 flex items-center justify-center text-brand-600 dark:text-brand-400 border border-brand-200/50 dark:border-brand-500/20 shadow-inner">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
        </svg>
      </div>
      <div>
        <h3 class="text-lg font-bold text-gray-900 dark:text-white">
          {{ 'users.resetPasswordModal.title' | translate }}
        </h3>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
          {{ 'users.resetPasswordModal.description' | translate }}
        </p>
      </div>
    </div>
  </div>

  <!-- Body Content -->
  <div class="p-6 bg-gray-50/50 dark:bg-gray-900/50 rounded-b-2xl space-y-5">

    <!-- Selected User Summary Card -->
    <div *ngIf="user" class="p-4 rounded-xl bg-white dark:bg-gray-800 border border-gray-200/80 dark:border-gray-700/80 shadow-xs flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-brand-500/10 text-brand-600 dark:text-brand-400 flex items-center justify-center font-bold text-sm">
          {{ user.name ? user.name.charAt(0).toUpperCase() : 'U' }}
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-sm font-bold text-gray-900 dark:text-white">{{ user.name }}</span>
            <span class="font-mono text-[11px] font-bold px-2 py-0.5 rounded-md bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-200/60 dark:border-brand-500/20">
              {{ user.code }}
            </span>
          </div>
          <span class="text-xs text-gray-500 dark:text-gray-400">{{ user.email }}</span>
        </div>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- New Password -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            {{ 'users.resetPasswordModal.newPassword' | translate }} <span class="text-error-500">*</span>
          </label>
          <button type="button" (click)="generatePassword()"
            class="inline-flex items-center gap-1 text-xs font-semibold text-brand-600 dark:text-brand-400 hover:text-brand-700 dark:hover:text-brand-300 hover:underline">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            {{ 'users.resetPasswordModal.generatePassword' | translate }}
          </button>
        </div>
        <div class="relative">
          <input [type]="showNewPassword ? 'text' : 'password'" [(ngModel)]="newPassword" name="newPassword" required
            class="w-full rounded-xl border border-gray-300 bg-white px-4 py-2.5 text-sm text-gray-900 outline-none transition-all focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white ltr:pr-10 rtl:pl-10 placeholder:text-gray-400 dark:placeholder:text-gray-500"
            [placeholder]="'••••••••'" />
          <button type="button" (click)="toggleShowNewPassword()"
            class="absolute top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors p-1.5 ltr:right-2 rtl:left-2">
            <svg *ngIf="!showNewPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showNewPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">
          {{ 'users.resetPasswordModal.confirmPassword' | translate }} <span class="text-error-500">*</span>
        </label>
        <div class="relative">
          <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" required
            class="w-full rounded-xl border border-gray-300 bg-white px-4 py-2.5 text-sm text-gray-900 outline-none transition-all focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white ltr:pr-10 rtl:pl-10 placeholder:text-gray-400 dark:placeholder:text-gray-500"
            [placeholder]="'••••••••'" />
          <button type="button" (click)="toggleShowConfirmPassword()"
            class="absolute top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors p-1.5 ltr:right-2 rtl:left-2">
            <svg *ngIf="!showConfirmPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showConfirmPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Must Change Password On Next Login Toggle -->
      <div class="p-3.5 rounded-xl bg-amber-50/60 dark:bg-amber-950/20 border border-amber-200/80 dark:border-amber-800/40">
        <label class="flex items-start gap-3 cursor-pointer">
          <input type="checkbox" [(ngModel)]="mustChangePasswordOnNextLogin" name="mustChangePasswordOnNextLogin"
            class="mt-0.5 h-4 w-4 rounded-sm border-gray-300 text-brand-600 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-800" />
          <div class="flex-1">
            <span class="block text-sm font-semibold text-gray-900 dark:text-white">
              {{ 'users.resetPasswordModal.mustChangeOnLogin' | translate }}
            </span>
            <span class="block text-xs text-gray-500 dark:text-gray-400 mt-0.5">
              {{ 'users.resetPasswordModal.mustChangeOnLoginHint' | translate }}
            </span>
          </div>
        </label>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-end gap-3 pt-3 border-t border-gray-200/80 dark:border-gray-800">
        <button type="button" (click)="onClose()"
          class="px-4 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 dark:bg-gray-800 dark:text-gray-300 dark:border-gray-700 dark:hover:bg-gray-700/80 transition-colors">
          {{ 'common.cancel' | translate }}
        </button>

        <button type="submit" [disabled]="saving || !newPassword || !confirmPassword"
          class="flex items-center gap-2 px-5 py-2.5 text-sm font-medium text-white bg-brand-500 rounded-xl hover:bg-brand-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-md shadow-brand-500/20">
          <svg *ngIf="saving" class="h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>{{ (saving ? 'users.resetPasswordModal.saving' : 'users.resetPasswordModal.save') | translate }}</span>
        </button>
      </div>

    </form>

  </div>
</app-modal>

<!-- Error Banner for Modal Feedback -->
<app-error-banner [isVisible]="validationErrors.length > 0" [errors]="validationErrors"
  (close)="validationErrors = []"></app-error-banner>
