<app-page-breadcrumb [pageTitle]="'stockTransactions.title'" />

<div class="space-y-6">
  <app-crud-list
    [pageTitle]="'stockTransactions.list'"
    [columns]="columns"
    [data]="data"
    [isLoading]="loading"
    [searchPlaceholder]="'common.search'"
    [filters]="filters"
    [hideAdd]="true"
    [hideEdit]="true"
    [hideView]="true"
    [hideActions]="isActionHidden()"
    [customActions]="customActions"
    [showIncludeDisabledToggle]="false"
    (customAction)="onCustomAction($event)"
    [hideBuiltInSearch]="true"
    [hasAdvancedFilters]="true"
    [hasActiveAdvancedFilters]="hasActiveAdvancedFilters"
    (loadData)="loadData()"
    (search)="loadData()"
    (pageChange)="onPageChange($event)"
    (refresh)="resetFilters()">

    <div header-actions class="flex items-center gap-2">
      <button (click)="exportExcel()" [disabled]="loading || exportingExcel" class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-emerald-700 bg-emerald-50 rounded-lg hover:bg-emerald-100 transition-colors border border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20 dark:hover:bg-emerald-500/20 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
        <svg *ngIf="exportingExcel" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <svg *ngIf="!exportingExcel" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        <span>{{ 'common.exportExcel' | translate }}</span>
      </button>

      <button (click)="exportPdf()" [disabled]="loading || exportingPdf" class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-error-700 bg-error-50 rounded-lg hover:bg-error-100 transition-colors border border-error-200 dark:bg-error-500/10 dark:text-error-400 dark:border-error-500/20 dark:hover:bg-error-500/20 focus:outline-none focus:ring-2 focus:ring-error-500/50 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
        <svg *ngIf="exportingPdf" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <svg *ngIf="!exportingPdf" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        <span>{{ 'common.exportPdf' | translate }}</span>
      </button>
    </div>

    <div custom-filters class="flex-1 w-full flex items-center gap-2">
      <input type="text" [(ngModel)]="filters.searchValue" (keyup.enter)="loadData()" [placeholder]="'common.search' | translate" [disabled]="loading"
        class="dark:bg-dark-900 h-11 w-full sm:max-w-xs rounded-lg border border-gray-200 bg-transparent py-2.5 px-4 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-800 dark:bg-white/3 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800 disabled:opacity-50 disabled:cursor-not-allowed" />
    </div>

    <div advanced-filters class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">

      <div>
        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">{{ 'stockTransactions.warehouse' | translate }}</label>
        <app-searchable-select [options]="warehousesOptions" placeholder="common.all"
          [(ngModel)]="filters.warehouseId" (selectionChange)="loadData()"></app-searchable-select>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">{{ 'stockTransactions.type' | translate }}</label>
        <app-searchable-select [options]="transactionTypeOptions" placeholder="common.all"
          [(ngModel)]="filters.transactionType" (selectionChange)="loadData()"></app-searchable-select>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">{{ 'common.date' | translate }} ({{ 'common.from' | translate }})</label>
        <app-date-picker id="dateFrom" name="dateFrom" [(ngModel)]="filters.dateFrom" (ngModelChange)="loadData()" [placeholder]="'common.selectDate' | translate"></app-date-picker>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">{{ 'common.date' | translate }} ({{ 'common.to' | translate }})</label>
        <app-date-picker id="dateTo" name="dateTo" [(ngModel)]="filters.dateTo" (ngModelChange)="loadData()" [placeholder]="'common.selectDate' | translate"></app-date-picker>
      </div>

      <div class="flex items-end sm:col-span-2 lg:col-span-1">
        <button (click)="resetFilters()" class="w-full px-4 py-2.5 text-sm text-error-600 bg-error-50 hover:bg-error-100 rounded-lg transition-colors font-medium dark:bg-error-500/10 dark:text-error-400 dark:hover:bg-error-500/20 shadow-theme-xs">
          {{ 'common.reset' | translate }}
        </button>
      </div>
    </div>

  </app-crud-list>
</div>

<app-print-preview-modal 
  *ngIf="isPrintModalOpen"
  [isOpen]="isPrintModalOpen" 
  [pdfBlobUrl]="pdfBlobUrl" 
  [loading]="pdfLoading"
  [title]="'Transaction ' + (selectedTransactionForPrint?.referenceCode || '')"
  (close)="closePrintModal()">
</app-print-preview-modal>
