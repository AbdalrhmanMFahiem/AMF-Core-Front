<app-page-breadcrumb [pageTitle]="'items.title'" />
<div class="space-y-6">
  <app-crud-list
    [pageTitle]="translate.instant('items.title')"
  [searchPlaceholder]="translate.instant('crud.tableSearchPlaceholder')"
  [addBtnText]="translate.instant('items.addNew')"
  [data]="data"
  [columns]="columns"
  [filters]="filters"
  [includeDisabled]="includeDisabled"
  [isLoading]="loading"
  (search)="onSearch()"
  (includeDisabledChange)="onIncludeDisabledChanged($event)"
  (pageChange)="onPageChange($event)"
  (add)="onAdd()"
  (edit)="onEdit($event)"
  (view)="onView($event)"
  (toggleStatus)="onToggleStatus($event)">

    <ng-template #customColumn let-item let-col="col">
      <ng-container *ngIf="col.field === 'baseUomType'">
        <app-uom-type-badge [type]="item.baseUomType"></app-uom-type-badge>
      </ng-container>
    </ng-template>
  </app-crud-list>
</div>
