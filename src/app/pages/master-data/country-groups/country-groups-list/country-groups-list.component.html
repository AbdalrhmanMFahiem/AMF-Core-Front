<app-page-breadcrumb [pageTitle]="'countryGroups.list.title' | translate"></app-page-breadcrumb>
<div class="space-y-6">
  <app-crud-list 
    [pageTitle]="'countryGroups.list.title' | translate" 
    [searchPlaceholder]="'common.searchPlaceholder' | translate"
    [addBtnText]="'countryGroups.addNew' | translate"
    [columns]="columns" 
    [data]="data" 
    [filters]="filters"
    [includeDisabled]="includeDisabled"
    [isLoading]="loading"
    (search)="onSearch()"
    (add)="onAdd()"
    (view)="onView($event)"
    (edit)="onEdit($event)"
    (toggleStatus)="onToggleStatus($event)"
    (pageChange)="onPageChange($event)"
    (includeDisabledChange)="onIncludeDisabledChanged($event)">
  </app-crud-list>
</div>
